<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Word Search &mdash; 6AS Word Games</title>
<link rel="stylesheet" href="../../style.css">
<style>
  body {
    padding: 10px;
  }

  .page {
    max-width: 620px;
  }

  #unit-name {
    text-align: center;
    color: var(--muted);
    margin-top: -8px;
  }

  #message {
    text-align: center;
    min-height: 26px;
    font-weight: 700;
    font-size: 17px;
  }

  #grid-wrap {
    display: flex;
    justify-content: center;
    margin: 12px 0;
  }

  #grid {
    display: grid;
    gap: 1px;
    background: var(--card-border);
    border: 2px solid var(--card-border);
    touch-action: none;
    user-select: none;
  }

  .cell {
    aspect-ratio: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(9px, 2.6vw, 15px);
    color: var(--text);
  }

  .cell.selecting {
    background: #cfe0ff;
  }

  .cell.found-0 { background: #ffd166; }
  .cell.found-1 { background: #a0c35a; }
  .cell.found-2 { background: #b0c4ef; }
  .cell.found-3 { background: #ba81c5; }
  .cell.found-4 { background: #f28482; }
  .cell.found-5 { background: #90dbf4; }
  .cell.found-6 { background: #f6bd60; }
  .cell.found-7 { background: #84a59d; }

  #word-list {
    list-style: none;
    padding: 0;
    margin: 10px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  #word-list li {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 700;
    font-size: 14px;
  }

  #word-list li.found {
    text-decoration: line-through;
    color: var(--muted);
    border-color: var(--muted);
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  @media print {
    #message, .actions, .top-nav, header p { display: none; }
    .cell.found-0, .cell.found-1, .cell.found-2, .cell.found-3,
    .cell.found-4, .cell.found-5, .cell.found-6, .cell.found-7 {
      background: var(--bg);
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-nav"><a href="../../index.html">&larr; Home</a></div>
  <header class="site-header">
    <h1>Word Search</h1>
    <p id="unit-name"></p>
  </header>

  <div id="message" aria-live="polite"></div>
  <div id="grid-wrap"><div id="grid"></div></div>
  <ul id="word-list"></ul>

  <div class="actions">
    <button id="new-puzzle-btn" class="btn secondary">New Puzzle</button>
    <button id="print-btn" class="btn secondary">Print</button>
  </div>
</div>

<script src="wordsearch.js"></script>
</body>
</html>
